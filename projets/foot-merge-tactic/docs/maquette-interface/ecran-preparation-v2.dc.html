<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Préparation du match — figurines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#16201A}
a{color:#3563C0}a:hover{color:#244A96}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF1EC; padding: 10px 8px 12px; display: flex; flex-direction: column; gap: 6px; font-family: Inter, system-ui, sans-serif; color: #16201A; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Préparation</span>
        <span style="font-size: 11px; font-weight: 600; color: #4A5A50">Groupe A · Match 2/3</span>
      </div>
      <div style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; border: 1px solid #D5DCD6; color: #16201A; border-radius: 999px; padding: 3px 10px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700">0:24</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{teams}}" as="t" hint-placeholder-count="4">
        <button type="button" aria-label="{{t.aria}}" style="position: relative; display: flex; align-items: center; gap: 5px; padding: 4px 5px; border-radius: 10px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: #16201A; cursor: pointer; text-align: left; min-height: 38px">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 50%; background: {{t.av}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{t.letter}}</span>
          <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2">
            <span style="font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
            <span style="font-size: 10px; color: #4A5A50">{{t.pts}}</span>
          </span>
          <sc-if value="{{t.next}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: -8px; right: 4px; background: #C2413D; color: #FFFFFF; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 4px; border-radius: 4px">Prochain</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 8px; align-items: stretch">
    <div style="width: 60px; flex: none; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 9px; font-weight: 700; color: #4A5A50; text-transform: uppercase; letter-spacing: 0.06em">Pays</span>
      <sc-for list="{{nations}}" as="tr" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 8px; background: {{tr.bg}}">
          <span style="width: 26px; height: 26px; flex: none; box-sizing: border-box; border-radius: 6px; border: 2px solid {{tr.border}}; background: {{tr.badge}}; color: {{tr.badgeFg}}; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{tr.code}}</span>
          <span style="display: flex; align-items: baseline; color: {{tr.fg}}">
            <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700">{{tr.n}}</span>
            <span style="font-size: 9px; font-weight: 600">/{{tr.next}}</span>
          </span>
        </div>
      </sc-for>
      <span style="font-size: 9px; font-weight: 700; color: #4A5A50; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px">Style</span>
      <sc-for list="{{styles}}" as="tr" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 8px; background: {{tr.bg}}">
          <span style="width: 26px; height: 26px; flex: none; box-sizing: border-box; border-radius: 6px; border: 2px solid {{tr.border}}; background: {{tr.badge}}; color: {{tr.badgeFg}}; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{tr.code}}</span>
          <span style="display: flex; align-items: baseline; color: {{tr.fg}}">
            <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700">{{tr.n}}</span>
            <span style="font-size: 9px; font-weight: 600">/{{tr.next}}</span>
          </span>
        </div>
      </sc-for>
      <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; background: #FFFFFF; color: #16201A; border-radius: 8px; padding: 6px 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700">11/11</span>
        <span style="font-size: 9px; color: #4A5A50">titulaires</span>
      </div>
    </div>

    <div style="flex: 1; min-width: 0; position: relative; background: {{pitch}}; border-radius: 14px; padding: 12px 0 6px; overflow: hidden">
      <div style="position: absolute; top: -48px; left: 50%; margin-left: -48px; width: 96px; height: 96px; box-sizing: border-box; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%"></div>
      <div style="position: absolute; bottom: 0; left: 50%; margin-left: -60px; width: 120px; height: 76px; box-sizing: border-box; border: 2px solid rgba(255,255,255,0.3); border-bottom: none"></div>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center">
        <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
          <div style="display: flex; gap: 4px; margin-top: {{row.mt}}">
            <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="5">
              <div style="position: relative; width: 52px; height: 60px; flex: none; color: {{c.fg}}; opacity: {{c.op}}; z-index: {{c.z}}; display: flex; flex-direction: column; align-items: center; justify-content: center">
                <div style="position: absolute; top: 0; left: 0; width: 52px; height: 60px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: rgba(255,255,255,0.4)"></div>
                <div style="position: absolute; top: 2px; left: 2px; width: 48px; height: 56px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{c.pitch}}"></div>
                <div style="position: absolute; top: 2px; left: 2px; width: 48px; height: 56px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{c.bg}}; opacity: {{c.alpha}}"></div>
                <sc-if value="{{c.hasPlayer}}" hint-placeholder-val="{{false}}">
                  <div style="position: relative; width: 48px; height: 53px; margin-top: -10px"><svg width="48" height="53" viewBox="0 0 48 53" aria-hidden="true" style="position: absolute; top: 0; left: 0; overflow: visible"><g opacity="{{c.flame3}}"><path d="M24 -9 C17 3 12 12 13 24 C14 33 34 33 35 24 C36 12 31 3 24 -9 Z" fill="{{c.fl1}}" fill-opacity="0.85"></path><path d="M1 3 C-1 15 1 26 9 34 C14 39 20 33 17 27 C14 20 7 15 1 3 Z" fill="{{c.fl1}}" fill-opacity="0.85"></path><path d="M47 3 C49 15 47 26 39 34 C34 39 28 33 31 27 C34 20 41 15 47 3 Z" fill="{{c.fl1}}" fill-opacity="0.85"></path></g><g opacity="{{c.flame}}"><path d="M24 0 C19 9 15 14 16 24 C17 31 31 31 32 24 C33 14 29 9 24 0 Z" fill="{{c.fl2}}" fill-opacity="0.95"></path><path d="M7 10 C6 18 7 25 12 31 C16 35 21 31 19 26 C17 20 11 17 7 10 Z" fill="{{c.fl2}}" fill-opacity="0.9"></path><path d="M41 10 C42 18 41 25 36 31 C32 35 27 31 29 26 C31 20 37 17 41 10 Z" fill="{{c.fl2}}" fill-opacity="0.9"></path><path d="M24 7 C21 13 19 17 20 24 C21 28 27 28 28 24 C29 17 27 13 24 7 Z" fill="{{c.fl3}}"></path></g><ellipse cx="24" cy="47" rx="17" ry="5" fill="#16201A" fill-opacity="0.22"></ellipse><ellipse cx="24" cy="47" rx="17" ry="5" fill="none" stroke="#16201A" stroke-width="5" stroke-opacity="{{c.ringOp}}"></ellipse><ellipse cx="24" cy="47" rx="17" ry="5" fill="none" stroke="{{c.ring}}" stroke-width="3" stroke-opacity="{{c.ringOp}}"></ellipse><path d="M5 3 L6.40 6.60 L10 8 L6.40 9.40 L5 13 L3.60 9.40 L0 8 L3.60 6.60 Z M43 -1 L44.68 3.32 L49 5 L44.68 6.68 L43 11 L41.32 6.68 L37 5 L41.32 3.32 Z M2 26.5 L2.98 29.02 L5.5 30 L2.98 30.98 L2 33.5 L1.02 30.98 L-1.5 30 L1.02 29.02 Z M46 23 L47.12 25.88 L50 27 L47.12 28.12 L46 31 L44.88 28.12 L42 27 L44.88 25.88 Z M24 -11.5 L25.26 -8.26 L28.5 -7 L25.26 -5.74 L24 -2.5 L22.74 -5.74 L19.5 -7 L22.74 -8.26 Z" fill="#FFFFFF" stroke="#C04BFF" stroke-width="0.9" stroke-linejoin="round" opacity="{{c.sparkle}}"></path><path d="M7.06 47.44 A17 5 0 0 0 14.25 51.1 M16.82 51.53 A17 5 0 0 0 31.18 51.53 M33.75 51.1 A17 5 0 0 0 40.94 47.44" fill="none" stroke="#16201A" stroke-opacity="{{c.baseOp}}" stroke-width="2.4" stroke-linecap="round"></path><path d="M7.06 47.44 A17 5 0 0 0 14.25 51.1" fill="none" stroke="#16201A" stroke-width="4.4" stroke-linecap="round" stroke-opacity="{{c.o1}}"></path><path d="M7.06 47.44 A17 5 0 0 0 14.25 51.1" fill="none" stroke="#FFC400" stroke-width="2.6" stroke-linecap="round" stroke-opacity="{{c.o1}}"></path><path d="M16.82 51.53 A17 5 0 0 0 31.18 51.53" fill="none" stroke="#16201A" stroke-width="4.4" stroke-linecap="round" stroke-opacity="{{c.o2}}"></path><path d="M16.82 51.53 A17 5 0 0 0 31.18 51.53" fill="none" stroke="#FFC400" stroke-width="2.6" stroke-linecap="round" stroke-opacity="{{c.o2}}"></path><path d="M33.75 51.1 A17 5 0 0 0 40.94 47.44" fill="none" stroke="#16201A" stroke-width="4.4" stroke-linecap="round" stroke-opacity="{{c.o3}}"></path><path d="M33.75 51.1 A17 5 0 0 0 40.94 47.44" fill="none" stroke="#FFC400" stroke-width="2.6" stroke-linecap="round" stroke-opacity="{{c.o3}}"></path></svg><img src="{{c.img}}" alt="{{c.name}}" width="48" height="49" style="position: absolute; left: 0; bottom: 5px; display: block; width: 48px; height: 49px; filter: {{c.aura}}; transform: scale({{c.scale}}); transform-origin: 50% 100%"></div>
                  <sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}">
                    <span style="position: absolute; top: -26px; left: 50%; transform: translateX(-50%); background: #FFFFFF; color: #16201A; font-size: 10px; font-weight: 700; line-height: 1.4; padding: 0 6px; border-radius: 6px; white-space: nowrap; box-shadow: 0 0 0 2px #FFC400">{{c.name}}</span>
                  </sc-if>
                </sc-if>
                <sc-if value="{{c.isEmpty}}" hint-placeholder-val="{{true}}">
                  <span style="position: relative; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; opacity: {{c.la}}">{{c.role}}</span>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
        <div style="position: relative; width: 108px; height: 60px; margin-top: -11px; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <div style="position: absolute; top: 0; left: 0; width: 108px; height: 60px; clip-path: polygon(0 25%, 24.07% 0, 48.15% 25%, 51.85% 25%, 75.93% 0, 100% 25%, 100% 75%, 75.93% 100%, 51.85% 75%, 48.15% 75%, 24.07% 100%, 0 75%); background: rgba(255,255,255,0.4)"></div>
          <div style="position: absolute; top: 2px; left: 2px; width: 104px; height: 56px; clip-path: polygon(0 25%, 24.07% 0, 48.15% 25%, 51.85% 25%, 75.93% 0, 100% 25%, 100% 75%, 75.93% 100%, 51.85% 75%, 48.15% 75%, 24.07% 100%, 0 75%); background: {{gk.pitch}}"></div>
          <div style="position: absolute; top: 2px; left: 2px; width: 104px; height: 56px; clip-path: polygon(0 25%, 24.07% 0, 48.15% 25%, 51.85% 25%, 75.93% 0, 100% 25%, 100% 75%, 75.93% 100%, 51.85% 75%, 48.15% 75%, 24.07% 100%, 0 75%); background: {{gk.bg}}; opacity: {{gk.alpha}}"></div>
          <div style="position: relative; width: 48px; height: 53px; margin-top: -10px"><svg width="48" height="53" viewBox="0 0 48 53" aria-hidden="true" style="position: absolute; top: 0; left: 0; overflow: visible"><g opacity="{{gk.flame3}}"><path d="M24 -9 C17 3 12 12 13 24 C14 33 34 33 35 24 C36 12 31 3 24 -9 Z" fill="{{gk.fl1}}" fill-opacity="0.85"></path><path d="M1 3 C-1 15 1 26 9 34 C14 39 20 33 17 27 C14 20 7 15 1 3 Z" fill="{{gk.fl1}}" fill-opacity="0.85"></path><path d="M47 3 C49 15 47 26 39 34 C34 39 28 33 31 27 C34 20 41 15 47 3 Z" fill="{{gk.fl1}}" fill-opacity="0.85"></path></g><g opacity="{{gk.flame}}"><path d="M24 0 C19 9 15 14 16 24 C17 31 31 31 32 24 C33 14 29 9 24 0 Z" fill="{{gk.fl2}}" fill-opacity="0.95"></path><path d="M7 10 C6 18 7 25 12 31 C16 35 21 31 19 26 C17 20 11 17 7 10 Z" fill="{{gk.fl2}}" fill-opacity="0.9"></path><path d="M41 10 C42 18 41 25 36 31 C32 35 27 31 29 26 C31 20 37 17 41 10 Z" fill="{{gk.fl2}}" fill-opacity="0.9"></path><path d="M24 7 C21 13 19 17 20 24 C21 28 27 28 28 24 C29 17 27 13 24 7 Z" fill="{{gk.fl3}}"></path></g><ellipse cx="24" cy="47" rx="17" ry="5" fill="#16201A" fill-opacity="0.22"></ellipse><ellipse cx="24" cy="47" rx="17" ry="5" fill="none" stroke="#16201A" stroke-width="5" stroke-opacity="{{gk.ringOp}}"></ellipse><ellipse cx="24" cy="47" rx="17" ry="5" fill="none" stroke="{{gk.ring}}" stroke-width="3" stroke-opacity="{{gk.ringOp}}"></ellipse><path d="M5 3 L6.40 6.60 L10 8 L6.40 9.40 L5 13 L3.60 9.40 L0 8 L3.60 6.60 Z M43 -1 L44.68 3.32 L49 5 L44.68 6.68 L43 11 L41.32 6.68 L37 5 L41.32 3.32 Z M2 26.5 L2.98 29.02 L5.5 30 L2.98 30.98 L2 33.5 L1.02 30.98 L-1.5 30 L1.02 29.02 Z M46 23 L47.12 25.88 L50 27 L47.12 28.12 L46 31 L44.88 28.12 L42 27 L44.88 25.88 Z M24 -11.5 L25.26 -8.26 L28.5 -7 L25.26 -5.74 L24 -2.5 L22.74 -5.74 L19.5 -7 L22.74 -8.26 Z" fill="#FFFFFF" stroke="#C04BFF" stroke-width="0.9" stroke-linejoin="round" opacity="{{gk.sparkle}}"></path><path d="M7.06 47.44 A17 5 0 0 0 14.25 51.1 M16.82 51.53 A17 5 0 0 0 31.18 51.53 M33.75 51.1 A17 5 0 0 0 40.94 47.44" fill="none" stroke="#16201A" stroke-opacity="{{gk.baseOp}}" stroke-width="2.4" stroke-linecap="round"></path><path d="M7.06 47.44 A17 5 0 0 0 14.25 51.1" fill="none" stroke="#16201A" stroke-width="4.4" stroke-linecap="round" stroke-opacity="{{gk.o1}}"></path><path d="M7.06 47.44 A17 5 0 0 0 14.25 51.1" fill="none" stroke="#FFC400" stroke-width="2.6" stroke-linecap="round" stroke-opacity="{{gk.o1}}"></path><path d="M16.82 51.53 A17 5 0 0 0 31.18 51.53" fill="none" stroke="#16201A" stroke-width="4.4" stroke-linecap="round" stroke-opacity="{{gk.o2}}"></path><path d="M16.82 51.53 A17 5 0 0 0 31.18 51.53" fill="none" stroke="#FFC400" stroke-width="2.6" stroke-linecap="round" stroke-opacity="{{gk.o2}}"></path><path d="M33.75 51.1 A17 5 0 0 0 40.94 47.44" fill="none" stroke="#16201A" stroke-width="4.4" stroke-linecap="round" stroke-opacity="{{gk.o3}}"></path><path d="M33.75 51.1 A17 5 0 0 0 40.94 47.44" fill="none" stroke="#FFC400" stroke-width="2.6" stroke-linecap="round" stroke-opacity="{{gk.o3}}"></path></svg><img src="{{gk.img}}" alt="{{gk.name}}" width="48" height="49" style="position: absolute; left: 0; bottom: 5px; display: block; width: 48px; height: 49px; filter: {{gk.aura}}; transform: scale({{gk.scale}}); transform-origin: 50% 100%"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 14px; padding: 4px 10px">
    <div style="display: flex; flex-direction: column; width: 40px; flex: none">
      <span style="font-size: 12px; font-weight: 700">Banc</span>
      <span style="font-size: 10px; color: #4A5A50">2/5</span>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{bench}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
          <sc-if value="{{b.filled}}" hint-placeholder-val="{{false}}">
            <img src="{{b.img}}" alt="{{b.name}}" width="36" height="36" style="display: block; width: 36px; height: 36px">
            <span style="font-size: 9px; font-weight: 700; color: #4A5A50">{{b.poste}}</span>
          </sc-if>
          <sc-if value="{{b.empty}}" hint-placeholder-val="{{true}}">
            <div style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #B5BEB8"></div>
            <span style="font-size: 9px; color: #6B776F">vide</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-radius: 14px; padding: 6px 8px 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700">Mercato</span>
        <span style="font-size: 10px; color: #4A5A50">Glisse un joueur ici pour le vendre</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; background: #FFF4CC; border-radius: 999px; padding: 2px 8px 2px 3px">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: #FFC400; border: 1.5px solid #16201A; box-sizing: border-box"></span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: #16201A">7</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{cards}}" as="k" hint-placeholder-count="6">
        <button type="button" aria-label="{{k.aria}}" style="position: relative; box-sizing: border-box; border: 2px solid {{k.edge}}; padding: 3px 2px 3px; margin: 0; background: #F1F4F0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; color: #16201A">
          <img src="{{k.img}}" alt="" width="36" height="36" style="display: block; width: 36px; height: 36px">
          <span style="font-size: 10px; font-weight: 700">{{k.poste}}</span>
          <span style="position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: #FFC400; border: 1.5px solid #16201A; color: #16201A; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{k.price}}</span>
          <sc-if value="{{k.fusion}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 700; color: #FFFFFF; background: #7347B8; border-radius: 4px; padding: 1px 4px; text-transform: uppercase; letter-spacing: 0.04em">Fusion</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fx":{"editor":"enum","default":"couleurs","options":["actuel","couleurs","socle"],"section":"Plateau"},"gauge":{"editor":"enum","default":"or","options":["or","magenta"],"section":"Plateau"},"pitch":{"editor":"color","default":"#c4dbcd","options":["#5DA86A","#7BBF84","#3F8A4C","#8A9A90"],"section":"Plateau"},"cellAlpha":{"editor":"range","default":0.3,"min":0,"max":1,"step":0.05,"section":"Plateau"},"labelAlpha":{"editor":"range","default":0.3,"min":0,"max":1,"step":0.05,"section":"Plateau"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ZONES = {
      gk:  { bg: '#F2C230', fg: '#FFFFFF', lane: '#F2C230', laneFg: '#FFFFFF' },
      def: { bg: '#2F5FD0', fg: '#FFFFFF', lane: '#8FB0F0', laneFg: '#FFFFFF' },
      mid: { bg: '#7B45D0', fg: '#FFFFFF', lane: '#B9A0EE', laneFg: '#FFFFFF' },
      att: { bg: '#D2403A', fg: '#FFFFFF', lane: '#F09A95', laneFg: '#FFFFFF' }
    };
    var alpha = this.props.cellAlpha ?? 0.3;
    var pitch = this.props.pitch ?? '#c4dbcd';
    var labelAlpha = this.props.labelAlpha ?? 0.3;
    var magenta = (this.props.gauge ?? 'or') === 'magenta';
    var NAT = { FRA: '#1F3A93', ESP: '#B85600', BRA: '#17773F', ITA: '#0B7FA8' };
    var PLAYERS = {
      TR: ['FRA', 2, 'Roux'], BL: ['BRA', 3, 'Lima'], KM: ['BRA', 1, 'Moura'], IS: ['ESP', 1, 'Salvat'],
      PA: ['ESP', 0, 'Arnau'], HF: ['FRA', 1, 'Ferrand'], RC: ['ESP', 0, 'Castell'], JM: ['FRA', 0, 'Marchal'],
      LM: ['ITA', 0, 'Monti'], NV: ['ITA', 1, 'Vitale'], MO: ['FRA', 0, 'Ollivier']
    };
    var fx = this.props.fx ?? 'couleurs';
    function look(n) {
