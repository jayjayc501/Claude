# « Je te l'avais dit » : fabrique l'APK Android (fichier d'installation) avec le service EAS d'Expo.
# Lancement manuel : onglet Actions › jetelavaisdit-apk › Run workflow.
# Prérequis : secret EXPO_TOKEN (compte Expo gratuit › Access tokens).
name: jetelavaisdit-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: projets/jetelavaisdit/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Envoie le dossier tel quel (il est dans un sous-dossier du dépôt).
      EAS_NO_VCS: 1
    steps:
      - name: Vérifier la clé Expo
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Le secret EXPO_TOKEN est manquant (GitHub › Settings › Secrets and variables › Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installation des paquets
        run: |
          cp .env.example .env
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Lier le projet au compte Expo
        run: eas init --non-interactive --force

      - name: Construire l'APK (10 à 30 minutes)
        run: |
          eas build --platform android --profile apk --non-interactive --wait --json > build.json
          URL=$(node -e "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; console.log(x.artifacts.buildUrl || x.artifacts.applicationArchiveUrl)")
          echo "APK : $URL"
          {
            echo "## APK Android prêt"
            echo ""
            echo "Ouvrir ce lien sur le téléphone Android pour télécharger et installer l'app :"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
