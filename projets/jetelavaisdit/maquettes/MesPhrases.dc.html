<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes phrases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C8FF3D}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0C12; color: #FFFFFF; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 56px 24px 16px; gap: 14px">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 32px; line-height: 1; font-weight: 800; letter-spacing: -1px">mes phrases</h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #1A1922; border: 1px solid #2C2A38; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 800">12</span>
        <span style="font-size: 12px; color: #A9A6B8">scellées</span>
      </div>
      <div style="background: #1A1922; border: 1px solid #2C2A38; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 800; color: #C8FF3D">3</span>
        <span style="font-size: 12px; color: #A9A6B8">envoyées</span>
      </div>
      <div style="background: #1A1922; border: 1px solid #2C2A38; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 800; color: #FF4FA3">4</span>
        <span style="font-size: 12px; color: #A9A6B8">témoins</span>
      </div>
    </div>

    <div role="tablist" aria-label="Filtrer par état" style="display: flex; gap: 8px">
      <sc-for list="{{ etats }}" as="e" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{ e.choisi }}" onClick="{{ e.pick }}" style="font-family: 'Inter', sans-serif; background: {{ e.fond }}; border: 1px solid {{ e.bordure }}; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 700; color: {{ e.texte }}">{{ e.label }}</button>
      </sc-for>
    </div>

    <div role="group" aria-label="Filtrer par personne" style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{ personnes }}" as="p" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{ p.choisi }}" onClick="{{ p.pick }}" style="font-family: 'Inter', sans-serif; flex-shrink: 0; display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 5px; border-radius: 999px; background: {{ p.fond }}; border: 1px solid {{ p.bordure }}; color: {{ p.texte }}; font-size: 13px; font-weight: 700">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: {{ p.couleur }}; color: #0D0C12; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 800">{{ p.lettre }}</span>
          {{ p.nom }}
          <span style="font-size: 12px; font-weight: 700; opacity: 0.7">{{ p.nombre }}</span>
        </button>
      </sc-for>
    </div>

    <sc-for list="{{ visibles }}" as="ph" hint-placeholder-count="3">
      <sc-if value="{{ ph.enAttente }}" hint-placeholder-val="{{ true }}">
        <div style="flex-shrink: 0; background: #1A1922; border: 1px solid #2C2A38; border-radius: 28px; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center; min-height: 39px">
            <span style="font-size: 13px; font-weight: 600; color: #A9A6B8">{{ ph.date }}</span>
            <sc-if value="{{ ph.aCompteur }}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #A9A6B8">
                <svg width="52" height="39" viewBox="0 0 200 150" role="img" aria-label="{{ ph.joursLabel }}" style="transform: rotate(-6deg)"><path d="M72 44V30a28 28 0 0 1 56 0v14" stroke="#C8FF3D" stroke-width="13" fill="none" stroke-linecap="round"></path><path d="M36 40h128a26 26 0 0 1 26 26v36a26 26 0 0 1-26 26H78l-30 22v-22H36a26 26 0 0 1-26-26V66a26 26 0 0 1 26-26z" fill="#C8FF3D"></path><text x="100" y="104" text-anchor="middle" font-family="Unbounded, sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="#0D0C12">{{ ph.jours }}</text></svg>
                jours
              </span>
            </sc-if>
          </div>
          <p style="margin: 0; font-size: 19px; line-height: 1.3; font-weight: 800">« {{ ph.texte }} »</p>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #A9A6B8">
            <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: {{ ph.couleur }}; color: #0D0C12; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 800">{{ ph.lettre }}</span>
            Dit à <b style="color: #FFFFFF">{{ ph.temoin }}</b> · {{ ph.lien }}
          </span>
          <a href="Partage.dc.html" style="align-self: flex-start; display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; box-sizing: border-box; background: {{ ph.boutonFond }}; border: 1px solid {{ ph.boutonBordure }}; color: {{ ph.boutonTexte }}; font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; text-decoration: none">Je te l'avais dit, {{ ph.prenom }} !</a>
        </div>
      </sc-if>
      <sc-if value="{{ ph.revelee }}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; background: #FF4FA3; color: #0D0C12; border-radius: 28px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
          <span style="font-size: 13px; font-weight: 700">{{ ph.date }}</span>
          <p style="margin: 0; font-size: 19px; line-height: 1.3; font-weight: 800">« {{ ph.texte }} »</p>
          <span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; background: #0D0C12; color: #FFFFFF; border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13px; font-weight: 700">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" stroke="#C8FF3D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            Envoyée à {{ ph.temoin }}
          </span>
        </div>
      </sc-if>
    </sc-for>
    <sc-if value="{{ rien }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 24px 0 0; text-align: center; font-size: 14px; color: #A9A6B8">Rien dans cette catégorie.</p>
    </sc-if>
  </div>

  <nav aria-label="Navigation principale" style="display: flex; gap: 8px; margin: 0 24px 24px; padding: 6px; background: #1A1922; border: 1px solid #2C2A38; border-radius: 999px; flex-shrink: 0">
    <a href="Ecrire.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; text-decoration: none; color: #A9A6B8; font-size: 14px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" stroke="#A9A6B8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
      Écrire
    </a>
    <a href="MesPhrases.dc.html" aria-current="page" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; background: #FFFFFF; text-decoration: none; color: #0D0C12; font-size: 14px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" stroke="#0D0C12" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
      Mes phrases
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { etat: 'toutes', personne: null };
  }

  renderVals() {
    var s = this.state;
    var self = this;
    var GENS = {
      lea: { nom: 'Léa M.', prenom: 'Léa', couleur: '#FFFFFF' },
      sarah: { nom: 'Sarah K.', prenom: 'Sarah', couleur: '#FF4FA3' },
      yanis: { nom: 'Yanis T.', prenom: 'Yanis', couleur: '#C8FF3D' },
      maman: { nom: 'Maman', prenom: 'Maman', couleur: '#A9A6B8' }
    };
    var PHRASES = [
      { qui: 'lea', lien: 'petite sœur', date: 'Aujourd’hui · 12h21', jours: 0, texte: 'Mon frère va se faire larguer avant l’été.' },
      { qui: 'sarah', lien: 'binôme de théâtre', date: '14 mars 2026', jours: 241, texte: 'Inès va finir avec le mec de son cours de théâtre.' },
      { qui: 'yanis', lien: 'pote', date: '2 février 2026 · révélée le 11 mars', revelee: true, texte: 'Le PSG va se faire sortir en huitièmes.' },
      { qui: 'maman', lien: 'famille', date: '28 janvier 2026', jours: 295, texte: 'Papa va s’endormir devant le film avant la 10e minute.' },
      { qui: 'yanis', lien: 'pote', date: '3 janvier 2026', jours: 320, texte: 'Tu vas lâcher la salle de sport avant février.' }
    ];

    var ETATS = [
      { id: 'toutes', label: 'Toutes' }, { id: 'attente', label: 'En attente' }, { id: 'envoyees', label: 'Envoyées' }
    ];

    var visibles = PHRASES.filter(function (p) {
      if (s.personne && p.qui !== s.personne) return false;
      if (s.etat === 'attente') return !p.revelee;
      if (s.etat === 'envoyees') return !!p.revelee;
      return true;
    }).map(function (p) {
      var g = GENS[p.qui];
      var mur = p.jours >= 1;
      return {
        enAttente: !p.revelee,
        revelee: !!p.revelee,
        date: p.date,
        texte: p.texte,
        jours: p.jours,
        joursLabel: p.jours + ' jours',
        aCompteur: mur,
        temoin: g.nom,
        prenom: g.prenom,
        lettre: g.prenom.charAt(0),
        couleur: g.couleur,
        lien: p.lien,
        boutonFond: mur ? '#C8FF3D' : 'transparent',
        boutonBordure: mur ? '#C8FF3D' : '#4A475A',
        boutonTexte: mur ? '#0D0C12' : '#FFFFFF'
      };
    });

    var personnes = [{ id: null, nom: 'Tous', prenom: '·', couleur: '#2C2A38', nombre: PHRASES.length }].concat(
      Object.keys(GENS).map(function (id) {
        var g = GENS[id];
        return {
          id: id, nom: g.nom, prenom: g.prenom, couleur: g.couleur,
          nombre: PHRASES.filter(function (p) { return p.qui === id; }).length
        };
      })
    ).map(function (p) {
      var choisi = s.personne === p.id;
      return {
        nom: p.nom,
        lettre: p.id ? p.prenom.charAt(0) : '★',
        couleur: p.id ? p.couleur : '#C8FF3D',
        nombre: p.nombre,
        choisi: choisi,
        fond: choisi ? '#FFFFFF' : '#1A1922',
        bordure: choisi ? '#FFFFFF' : '#2C2A38',
        texte: choisi ? '#0D0C12' : '#FFFFFF',
        pick: function () { self.setState({ personne: p.id }); }
      };
    });

    return {
      visibles: visibles,
      rien: visibles.length === 0,
      personnes: personnes,
      etats: ETATS.map(function (e) {
        var choisi = s.etat === e.id;
        return {
          label: e.label,
          choisi: choisi,
          fond: choisi ? '#FFFFFF' : '#1A1922',
          bordure: choisi ? '#FFFFFF' : '#2C2A38',
          texte: choisi ? '#0D0C12' : '#FFFFFF',
          pick: function () { self.setState({ etat: e.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
