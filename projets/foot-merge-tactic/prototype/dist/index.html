<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foot Merge Tactic · prototype 1</title>
<style>:root {
  --fond: #f6f5f0;
  --carte: #ffffff;
  --texte: #1f1e1c;
  --texte-2: #5f5e5a;
  --bord: rgba(0, 0, 0, 0.13);
  --pelouse: #dcebc9;
  --lignes: #ffffff;
  --zone: #0f6e56;
  --nous: #1d9e75;
  --nous-fonce: #085041;
  --eux: #d85a30;
  --eux-fonce: #712b13;
  --accent: #185fa5;
  --accent-fond: #e6f1fb;
  --sur-accent: #ffffff;
  --alerte: #ba7517;
  --erreur: #a32d2d;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #1c1c1a;
    --carte: #2a2a27;
    --texte: #f1efe8;
    --texte-2: #b4b2a9;
    --bord: rgba(255, 255, 255, 0.15);
    --pelouse: #2f5a17;
    --lignes: rgba(255, 255, 255, 0.75);
    --zone: #9fe1cb;
    --accent: #85b7eb;
    --accent-fond: #0c447c;
    --sur-accent: #042c53;
    --alerte: #ef9f27;
    --erreur: #f09595;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 520px; margin: 0 auto; padding: 10px 12px 40px; }
.entete h1 { font-size: 15px; font-weight: 600; margin: 2px 0 6px; color: var(--texte-2); }
.onglets { display: flex; gap: 6px; margin-bottom: 10px; }
.onglet, .bouton, .puce, .segment, .rang {
  font: inherit; color: inherit; background: var(--carte);
  border: 1px solid var(--bord); border-radius: 10px; cursor: pointer;
}
.onglet { flex: 1; min-height: 42px; font-weight: 500; }
.onglet-actif { border-color: var(--accent); color: var(--accent); background: var(--accent-fond); }
.ligne-statut { display: flex; justify-content: space-between; font-size: 14px; color: var(--texte-2); }
.message { font-size: 14px; color: var(--texte-2); min-height: 42px; margin: 2px 0 4px; line-height: 1.45; }
.message.erreur { color: var(--erreur); }
svg.planche, svg.terrain { width: 100%; display: block; touch-action: manipulation; user-select: none; }
svg.terrain { height: min(calc(100dvh - 300px), calc((min(100vw, 520px) - 24px) * 1.52)); min-height: 300px; }
svg.planche { height: min(calc(100dvh - 190px), calc((min(100vw, 520px) - 24px) * 1.43)); min-height: 320px; }
.pelouse { fill: var(--pelouse); }
.lignes { fill: none; stroke: var(--lignes); stroke-width: 1.4; }
.lignes .point { fill: var(--lignes); stroke: none; }
.lignes .but { fill: var(--lignes); stroke: none; opacity: 0.6; }
.zone { fill: var(--zone); fill-opacity: 0.05; stroke: var(--zone); stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 4 3; }
.zone-active { fill-opacity: 0.1; stroke-opacity: 0.9; stroke-width: 1.6; stroke-dasharray: none; }
.case rect { stroke: var(--zone); stroke-width: 1.2; cursor: pointer; }
.case-libre rect { fill: var(--carte); fill-opacity: 0.55; }
.case-prise rect { fill: var(--zone); fill-opacity: 0.12; }
.case-lui rect { fill: var(--accent); fill-opacity: 0.25; stroke: var(--accent); stroke-width: 2; }
.case-texte { font-size: 12px; text-anchor: middle; fill: var(--zone); pointer-events: none; }
.jeton { cursor: grab; touch-action: none; }
.jeton-zone-toucher { fill: transparent; }
.jeton-rond { fill: var(--nous); stroke: var(--nous-fonce); stroke-width: 1.5; }
.jeton-texte { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #fff; pointer-events: none; }
.jeton-choisi .jeton-rond { stroke: var(--accent); stroke-width: 4; }
.jeton-hors .jeton-rond { stroke: var(--alerte); stroke-width: 3; stroke-dasharray: 4 3; }
.jeton-autre { opacity: 0.55; }
.jeton-souleve { opacity: 1; pointer-events: none; }
.jeton-origine { opacity: 0.3; }
.jeton-souleve .jeton-rond { transform-box: fill-box; transform-origin: center; transform: scale(1.25); stroke: var(--accent); stroke-width: 4; }
.jeton-souleve .jeton-texte { font-size: 13px; }
.cible-case { fill: var(--accent); fill-opacity: 0.3; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; pointer-events: none; }
.puces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.puce { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.puce-id { font-weight: 600; }
.puce-compte { font-size: 12px; color: var(--texte-2); }
.puce-active { border-color: var(--zone); background: color-mix(in srgb, var(--zone) 14%, var(--carte)); }
.choisi { background: var(--carte); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; margin: 6px 0 10px; }
.choisi-nom { font-weight: 600; }
.choisi-detail { font-size: 14px; color: var(--texte-2); margin-bottom: 6px; }
h2 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
.effectif { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rang { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; text-align: left; min-height: 52px; }
.rang-choisi { border-color: var(--accent); background: var(--accent-fond); }
.pastille { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; background: var(--nous); }
.pastille-banc { background: transparent; color: var(--texte-2); border: 1.5px dashed var(--bord); }
.rang-texte { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.rang-nom { font-weight: 500; }
.rang-detail { font-size: 13px; color: var(--texte-2); }
.rang-postes { font-size: 12px; color: var(--texte-2); }
.bouton { min-height: 44px; padding: 0 16px; }
.bouton-principal { background: var(--accent); color: var(--sur-accent); border-color: var(--accent); font-weight: 500; }
.lancer { width: 100%; margin-top: 14px; min-height: 52px; }
.pion { stroke-width: 1.5; }
.pion-nous { fill: var(--nous); stroke: var(--nous-fonce); }
.pion-eux { fill: var(--eux); stroke: var(--eux-fonce); }
.ballon { fill: #fff; stroke: #2c2c2a; stroke-width: 1.2; }
.zone-match { fill: var(--zone); fill-opacity: 0.08; stroke: var(--zone); stroke-opacity: 0.6; stroke-width: 1; stroke-dasharray: 4 3; }
.legende { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; color: var(--texte-2); margin: 6px 0 10px; }
.rond { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.rond-nous { background: var(--nous); }
.rond-eux { background: var(--eux); margin-left: 6px; }
.commandes { display: flex; gap: 8px; margin-bottom: 8px; }
.commandes .bouton { flex: 1; }
.etiquette { font-size: 13px; color: var(--texte-2); }
.segments { display: flex; gap: 6px; margin: 4px 0 10px; }
.segment { flex: 1; min-height: 44px; }
.segment-actif { border-color: var(--accent); color: var(--accent); background: var(--accent-fond); }
.curseur { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.curseur input { flex: 1; }
.valeur { font-weight: 600; min-width: 36px; text-align: right; }
.case-a-cocher { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 44px; }
.case-a-cocher input { width: 20px; height: 20px; }
.note { font-size: 13px; color: var(--texte-2); }
button[hidden] { display: none; }
.banc-fond { fill: var(--carte); stroke: var(--bord); stroke-width: 1; }
.banc-titre { font-size: 12px; fill: var(--texte-2); }
.jeton-banc .jeton-rond { fill: var(--carte); stroke: var(--nous); stroke-width: 2; }
.jeton-banc .jeton-texte { fill: var(--nous-fonce); }
.case-fond { fill: var(--carte); fill-opacity: 0.35; stroke: var(--zone); stroke-opacity: 0.55; stroke-width: 1; pointer-events: none; }
.case-fond-prise { fill: var(--zone); fill-opacity: 0.12; }
.bouton-court { flex: 0 0 auto; padding: 0 12px; min-width: 56px; }
.bouton-actif { border-color: var(--accent); color: var(--accent); background: var(--accent-fond); }
.bouton:disabled { opacity: 0.45; }
@media (prefers-color-scheme: dark) { .jeton-banc .jeton-texte { fill: var(--zone); } }
.choix-plateau { display: flex; gap: 4px; }
.mini { font: inherit; font-size: 13px; color: var(--texte-2); background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; min-height: 32px; padding: 0 8px; cursor: pointer; }
.mini-actif { border-color: var(--accent); color: var(--accent); background: var(--accent-fond); }
.ligne-statut { align-items: center; }
/* Plateau de placement : couleurs par bande de jeu. Cases presque opaques :
   le plateau se lit d'abord, les lignes du terrain n'apparaissent que dans les joints. */
.case-plateau { stroke-width: 1.2; stroke-linejoin: round; pointer-events: none; fill-opacity: 0.88; }
.case-gardien { fill: #fac775; stroke: #ba7517; }
.case-defense { fill: #b5d4f4; stroke: #378add; }
.case-milieu { fill: #cecbf6; stroke: #7f77dd; }
.case-attaque { fill: #f7c1c1; stroke: #e24b4a; }
.case-cote { fill-opacity: 0.55; }
.case-role { font-size: 10px; font-weight: 600; text-anchor: middle; pointer-events: none; opacity: 0.8; }
.case-role-gardien { fill: #854f0b; }
.case-role-defense { fill: #185fa5; }
.case-role-milieu { fill: #534ab7; }
.case-role-attaque { fill: #a32d2d; }
@media (prefers-color-scheme: dark) {
  .case-plateau { fill-opacity: 0.9; }
  .case-cote { fill-opacity: 0.6; }
  .case-gardien { fill: #633806; stroke: #ba7517; }
  .case-defense { fill: #0c447c; stroke: #378add; }
  .case-milieu { fill: #3c3489; stroke: #7f77dd; }
  .case-attaque { fill: #791f1f; stroke: #e24b4a; }
  .case-role-gardien { fill: #fac775; }
  .case-role-defense { fill: #b5d4f4; }
  .case-role-milieu { fill: #cecbf6; }
  .case-role-attaque { fill: #f7c1c1; }
}

/* Annonces de match (But, Faute, Corner…) */
.annonce rect { fill: rgba(20, 24, 28, 0.78); }
.annonce text { fill: #fff; font: 700 22px system-ui, sans-serif; letter-spacing: 0.5px; }
.annonce { animation: annonce-entree 0.18s ease-out; transform-box: fill-box; transform-origin: center; }
.annonce-but rect { fill: rgba(200, 40, 40, 0.88); }
.annonce-but text { font-size: 34px; }
@keyframes annonce-entree { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

/* ---- Écran de préparation (maquette du 12/11) : panneaux clairs, peu de noir ---- */
.prepa { max-width: 420px; margin: 0 auto; background: #EEF1EC; color: #16201A; border-radius: 16px; padding: 8px 6px 10px; }
.prepa-contenu { display: flex; flex-direction: column; gap: 6px; }
.prepa-tete { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
.prepa-titre { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prepa-h { font-size: 18px; font-weight: 700; }
.prepa-h.petit { font-size: 14px; }
.prepa-sous { font-size: 11px; font-weight: 600; color: #4A5A50; }
.prepa-chrono { display: flex; align-items: center; gap: 5px; background: #fff; border: 1px solid #D5DCD6; border-radius: 999px; padding: 1px 10px; font-size: 15px; font-weight: 700; }
.prepa-groupe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
.prepa-equipe { position: relative; display: flex; align-items: center; gap: 5px; padding: 4px 5px; border-radius: 10px; border: 2px solid #D5DCD6; background: #fff; min-height: 38px; }
.prepa-equipe.toi { border-color: #3563C0; background: #E6EDFA; }
.prepa-equipe.prochain { border-color: #C2413D; background: #FBE9E8; }
.prepa-avatar { width: 20px; height: 20px; flex: none; border-radius: 50%; background: #4A5A50; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.toi .prepa-avatar { background: #3563C0; }
.prochain .prepa-avatar { background: #C2413D; }
.prepa-equipe-texte { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.prepa-equipe-nom { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prepa-equipe-pts { font-size: 10px; color: #4A5A50; }
.prepa-prochain { position: absolute; top: -8px; right: 4px; background: #C2413D; color: #fff; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 4px; border-radius: 4px; line-height: 1.4; }

.prepa-milieu { display: flex; gap: 8px; align-items: stretch; }
.prepa-traits { width: 60px; flex: none; display: flex; flex-direction: column; gap: 3px; }
.prepa-etiquette { font-size: 9px; font-weight: 700; color: #4A5A50; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
.prepa-trait { display: flex; align-items: center; gap: 4px; padding: 2px 3px; border-radius: 8px; background: #E1E6E2; color: #4F5B54; }
.prepa-trait.atteint { background: #fff; color: #16201A; }
.prepa-badge { width: 24px; height: 24px; flex: none; border-radius: 6px; border: 2px solid; color: #fff; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.prepa-trait.style .prepa-badge { background: #fff; border-color: #B5BEB8; color: #4F5B54; }
.prepa-badge svg { display: block; }
.prepa-trait.style.atteint .prepa-badge { background: #2B2F36; border-color: #2B2F36; color: #fff; }
.prepa-nombre { font-size: 15px; font-weight: 700; line-height: 1; }
.prepa-palier { font-size: 9px; font-weight: 600; }
.prepa-titulaires { margin-top: auto; display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 8px; padding: 6px 2px; font-size: 9px; color: #4A5A50; }
.prepa-titulaires .prepa-nombre { font-size: 16px; color: #16201A; margin-bottom: 2px; }
.prepa-terrain { flex: 1; min-width: 0; }
svg.prepa-plateau { width: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.prepa-pelouse { fill: #4E9A5A; }
.prepa-bande { fill: #58A564; }
.prepa-ligne { fill: none; stroke: #fff; stroke-opacity: 0.8; stroke-width: 1.6; }
.prepa-ligne .point { fill: #fff; stroke: none; }
.prepa-ligne .but { fill: #fff; fill-opacity: 0.35; }
.prepa-case { fill-opacity: 0.38; stroke: #fff; stroke-opacity: 0.45; stroke-width: 2; stroke-linejoin: round; pointer-events: none; }
.prepa-role { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; text-anchor: middle; fill: #fff; opacity: 0.6; pointer-events: none; }
.prepa-buste { cursor: grab; touch-action: none; }
.prepa-origine { opacity: 0.3; }
.prepa-cible { stroke-width: 3; stroke-linejoin: round; pointer-events: none; }
.prepa-cible.cible-ok { fill: #fff; fill-opacity: 0.35; stroke: #fff; }
.prepa-cible.cible-non { fill: #C2413D; fill-opacity: 0.25; stroke: #C2413D; }
.prepa-nom rect { fill: #fff; stroke: #FFC400; stroke-width: 2; }
.prepa-nom text { font-size: 10px; font-weight: 700; text-anchor: middle; fill: #16201A; }
.prepa-fantome { position: fixed; left: 0; top: 0; width: 56px; height: 57px; pointer-events: none; z-index: 20; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.3)); }

.prepa-banc, .prepa-mercato { background: #fff; border-radius: 14px; outline: 3px solid transparent; outline-offset: -3px; transition: outline-color 0.1s; }
.prepa-banc { display: flex; align-items: center; gap: 8px; padding: 4px 10px; }
.prepa-banc.cible-ok, .prepa-mercato.cible-ok { outline-color: #3563C0; }
.prepa-banc.cible-non, .prepa-mercato.cible-non { outline-color: #C2413D; }
.prepa-banc-titre { display: flex; flex-direction: column; width: 40px; flex: none; line-height: 1.3; }
.prepa-gras { font-size: 12px; font-weight: 700; }
.prepa-discret { font-size: 10px; color: #4A5A50; }
.prepa-places { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.prepa-place { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.prepa-tirable { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.prepa-place.choisi .prepa-poste { color: #16201A; background: #FFF4CC; border-radius: 4px; padding: 0 3px; }
.prepa-mini { display: block; width: 36px; height: 37px; pointer-events: none; }
.prepa-vide { width: 36px; height: 36px; border-radius: 50%; border: 2px dashed #B5BEB8; }
.prepa-poste { font-size: 9px; font-weight: 700; color: #4A5A50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.prepa-mercato { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; }
.prepa-mercato-tete { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.prepa-budget { display: flex; align-items: center; gap: 4px; background: #FFF4CC; border-radius: 999px; padding: 2px 8px 2px 3px; }
.prepa-piece { width: 18px; height: 18px; border-radius: 50%; background: #FFC400; border: 1.5px solid #16201A; }
.prepa-cartes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.prepa-carte { position: relative; font: inherit; color: #16201A; border: 2px solid #F1F4F0; padding: 3px 2px; margin: 0; background: #F1F4F0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; min-height: 58px; }
.prepa-carte.vide { border: 2px dashed #D5DCD6; background: transparent; cursor: default; }
.prepa-carte.fusion { border-color: #7347B8; }
.prepa-carte.trop-cher { opacity: 0.5; }
.prepa-carte .prepa-poste { font-size: 10px; color: #16201A; }
.prepa-prix { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FFC400; border: 1.5px solid #16201A; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.prepa-fusion { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 700; color: #fff; background: #7347B8; border-radius: 4px; padding: 1px 4px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.4; }
.prepa-toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); max-width: min(360px, calc(100vw - 32px)); background: #16201A; color: #fff; font-size: 13px; line-height: 1.35; padding: 8px 14px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; z-index: 30; text-align: center; }
.prepa-toast.visible { opacity: 0.94; transform: translate(-50%, 0); }
.prepa-toast.erreur { background: #8E2A27; }
/* Auras de fusion (bustes du banc et du glisser) : bleu, or, violet. */
.aura-1 { filter: drop-shadow(0 0 2px #5EC8FF) drop-shadow(0 0 5px #5EC8FF) drop-shadow(0 0 9px #5EC8FF); }
.aura-2 { filter: drop-shadow(0 0 2px #FFC400) drop-shadow(0 0 5px #FFC400) drop-shadow(0 0 9px #FFC400); }
.aura-3 { filter: drop-shadow(0 0 2px #FFFFFF) drop-shadow(0 0 3px #E9A8FF) drop-shadow(0 0 6px #C04BFF) drop-shadow(0 0 10px #8A2BE2) drop-shadow(0 0 14px #FF4FD8); }
.prepa-tactique { display: flex; flex-direction: column; gap: 3px; background: #fff; border-radius: 14px; padding: 3px 6px 6px; }
.prepa-tactique .prepa-etiquette { margin: 0 0 0 4px; }
.prepa-choix { display: flex; gap: 4px; }
.prepa-puce { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 10px; font-weight: 700; color: #4A5A50; background: #F1F4F0; border: 2px solid #F1F4F0; border-radius: 8px; padding: 4px 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prepa-puce.actif { color: #fff; background: #2B2F36; border-color: #2B2F36; }
</style>
</head>
