<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>

<style>

a{color:#C8FF3D}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0C12; color: #FFFFFF; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 28px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="MesPhrases.dc.html" aria-label="Retour" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1A1922; border: 1px solid #2C2A38; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 26px; line-height: 1.05; font-weight: 800; letter-spacing: -0.8px">envoie ta preuve.</h1>
  </div>

  <div style="margin-top: 22px; align-self: center; width: 216px; height: 384px; box-sizing: border-box; background: #0D0C12; border: 1px solid #2C2A38; border-radius: 28px; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 700; color: #A9A6B8"><b style="color: #FFFFFF">Sarah</b>, Jules te l'avait dit il y a…</span>
    <div style="display: flex; align-items: flex-end; gap: 8px">
      <svg width="96" height="72" viewBox="0 0 200 150" role="img" aria-label="241 jours" style="transform: rotate(-6deg)"><path d="M72 44V30a28 28 0 0 1 56 0v14" stroke="#C8FF3D" stroke-width="13" fill="none" stroke-linecap="round"></path><path d="M36 40h128a26 26 0 0 1 26 26v36a26 26 0 0 1-26 26H78l-30 22v-22H36a26 26 0 0 1-26-26V66a26 26 0 0 1 26-26z" fill="#C8FF3D"></path><text x="100" y="104" text-anchor="middle" font-family="Unbounded, sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="#0D0C12">241</text></svg>
      <span style="font-family: 'Unbounded', sans-serif; font-size: 13px; line-height: 1.1; font-weight: 800; padding-bottom: 12px">jours.</span>
    </div>
    <div style="background: #FF4FA3; color: #0D0C12; border-radius: 18px; padding: 12px; transform: rotate(-1.5deg); display: flex; flex-direction: column; gap: 8px">
      <span style="align-self: flex-start; display: flex; align-items: center; gap: 4px; background: #0D0C12; color: #C8FF3D; border-radius: 999px; padding: 3px 8px 3px 4px; font-size: 10px; font-weight: 800">
        <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#C8FF3D"></circle><path d="M7 12.5l3.2 3.2L17 9" stroke="#0D0C12" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        Vérifié
      </span>
      <p style="margin: 0; font-size: 14px; line-height: 1.25; font-weight: 800">« Inès va finir avec le mec de son cours de théâtre. »</p>
      <span style="align-self: flex-start; background: rgba(13,12,18,0.12); border-radius: 999px; padding: 4px 9px; font-size: 10px; font-weight: 800">{{ ditA }}</span>
      <span style="font-size: 10px; font-weight: 700">Scellée le 14 mars 2026 · 22h47</span>
    </div>
    <div style="flex-grow: 1"></div>
    <span style="font-family: 'Unbounded', sans-serif; font-size: 15px; line-height: 1.08; font-weight: 800">regarde, sarah.<br>je te l'avais <span style="color: #C8FF3D">dit.</span></span>
  </div>

  <div style="margin-top: 18px; background: #1A1922; border: 1px solid #2C2A38; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span aria-hidden="true" style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #FF4FA3; color: #0D0C12; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800">S</span>
    <label for="montrer-lien" style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
      <span style="font-size: 14px; font-weight: 800">Montrer votre lien</span>
      <span style="font-size: 12px; color: #A9A6B8">« pote » sur la carte</span>
    </label>
    <button id="montrer-lien" type="button" role="switch" aria-checked="{{ montrer }}" onClick="{{ basculer }}" style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 999px; border: none; padding: 3px; background: {{ interFond }}; display: flex; justify-content: {{ interCote }}">
      <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: {{ interRond }}"></span>
    </button>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="font-family: 'Inter', sans-serif; background: none; border: none; padding: 0; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">
      <span style="width: 54px; height: 54px; border-radius: 50%; background: #FF4FA3; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" stroke="#0D0C12" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5h.01"></path></svg></span>
      Story
    </button>
    <button type="button" style="font-family: 'Inter', sans-serif; background: none; border: none; padding: 0; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">
      <span style="width: 54px; height: 54px; border-radius: 50%; background: #1A1922; border: 1px solid #2C2A38; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.4-4A8 8 0 1 1 8 18.6z"></path></svg></span>
      WhatsApp
    </button>
    <button type="button" style="font-family: 'Inter', sans-serif; background: none; border: none; padding: 0; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">
      <span style="width: 54px; height: 54px; border-radius: 50%; background: #1A1922; border: 1px solid #2C2A38; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"></path></svg></span>
      Messages
    </button>
    <button type="button" style="font-family: 'Inter', sans-serif; background: none; border: none; padding: 0; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">
      <span style="width: 54px; height: 54px; border-radius: 50%; background: #1A1922; border: 1px solid #2C2A38; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>
      Copier le lien
    </button>
  </div>

  <a href="Carte.dc.html" style="margin-top: 20px; display: flex; align-items: center; justify-content: center; height: 60px; flex-shrink: 0; border-radius: 999px; background: #C8FF3D; color: #0D0C12; font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 800; text-decoration: none">Envoyer à Sarah</a>
  <p style="margin: 10px 0 0; font-size: 13px; color: #A9A6B8; text-align: center">Sarah voit la carte sans installer l'app.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { montrer: true };
  }

  renderVals() {
    var self = this;
    var m = this.state.montrer;
    return {
      montrer: m,
      ditA: m ? 'Dit à Sarah · pote' : 'Dit à Sarah',
      interFond: m ? '#C8FF3D' : '#4A475A',
      interRond: m ? '#0D0C12' : '#FFFFFF',
      interCote: m ? 'flex-end' : 'flex-start',
      basculer: function () { self.setState({ montrer: !m }); }
    };
  }
}
</script>
</body>
</html>
