<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idées d'applis classées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan : une colonne de lecture, liste classée façon tableau de bord, fiches en sections empilées.
     Papier gris-vert, encre ardoise, accent cobalt ; vert / ambre / gris pour le statut de marché. */
  --bg:#f3f4f1;
  --surface:#ffffff;
  --ink:#18212b;
  --muted:#566170;
  --line:#dde1e4;
  --accent:#1d55c4;
  --accent-soft:#e4ebfa;
  --ok:#17794a; --ok-soft:#e0f1e7;
  --warn:#93600f; --warn-soft:#f7ebd4;
  --off:#5f6874; --off-soft:#eaecef;
  --bad:#b0362e; --bad-soft:#f8e3e1;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#19202a; --ink:#e6eaef; --muted:#9ba6b4; --line:#2a333f;
    --accent:#7ea4ff; --accent-soft:#1e2b45;
    --ok:#5bc993; --ok-soft:#163327; --warn:#e3ac52; --warn-soft:#3a2d16;
    --off:#a0a9b5; --off-soft:#252c36; --bad:#f08a80; --bad-soft:#3b1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19202a; --ink:#e6eaef; --muted:#9ba6b4; --line:#2a333f;
  --accent:#7ea4ff; --accent-soft:#1e2b45;
  --ok:#5bc993; --ok-soft:#163327; --warn:#e3ac52; --warn-soft:#3a2d16;
  --off:#a0a9b5; --off-soft:#252c36; --bad:#f08a80; --bad-soft:#3b1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
.wrap{max-width:800px;margin:0 auto;padding:28px 16px 64px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:750;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 12px}
.fbtn{font:inherit;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fbtn .n{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn[aria-pressed="true"] .n{color:inherit}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:.92rem}
.toolbar label{display:inline-flex;align-items:center;gap:8px}
select{font:inherit;font-size:.92rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:2.2ch 1fr auto;gap:14px;align-items:start;padding:14px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.rank{font-family:var(--font-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.main{min-width:0;display:flex;flex-direction:column;gap:4px}
.name{font-family:var(--font-display);font-weight:650;font-size:1.06rem;line-height:1.25}
.pitch{color:var(--muted);font-size:.93rem;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.trou{background:var(--ok-soft);color:var(--ok)}
.chip.angle{background:var(--warn-soft);color:var(--warn)}
.chip.pris{background:var(--off-soft);color:var(--off)}
.chip.fav{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--accent);color:var(--bg);border:0;padding:2px 9px;font-weight:700}
.row.is-new{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.news{margin:0 0 18px;padding:16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--accent-soft)}
.news h2{margin:0 0 6px;font-family:var(--font-display);font-size:1.1rem;color:var(--accent);display:flex;align-items:center;gap:8px}
.news .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.news p{margin:0 0 10px}
.newlist{list-style:none;margin:0 0 12px;padding:0}
.newlist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.newlist li:first-child{border-top:0}
.newlist a{color:inherit;font-weight:700}
.newlist span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.cut{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.chip.cat{background:transparent;color:var(--muted);font-weight:400;padding-left:0}
.chip svg{width:12px;height:12px;fill:currentColor}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.total{font-family:var(--font-display);font-weight:750;font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1}
.total small{font-size:.7rem;color:var(--muted);font-weight:600;margin-left:1px}
.meter{display:grid;grid-template-columns:auto auto;column-gap:6px;row-gap:3px;align-items:center;font-size:.68rem;color:var(--muted)}
.pips{display:flex;gap:2px}
.pips i{width:7px;height:6px;border-radius:2px;background:var(--line);display:block}
.pips i.on{background:var(--accent)}
.pips i.half,.sc-bar i.half{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.row.is-pris .pips i.half{background:linear-gradient(90deg,var(--off) 50%,var(--line) 50%)}
.sc-row.sub{border-top:0;padding-top:0}
.sc-row.sub .sc-lab{padding-left:16px;font-size:.92em}
.row.is-pris .pips i.on{background:var(--off)}
.hint{color:var(--muted);font-size:.88rem;margin:10px 2px 0}
.method{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.93rem}
.method h2{color:var(--ink);font-size:1.05rem;margin-bottom:8px}
.method dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0}
.method dt{font-weight:700;color:var(--ink)}
.method dd{margin:0}
.empty{padding:22px 16px;color:var(--muted);margin:0}
.more{display:block;width:100%;margin-top:12px;padding:13px 16px;font:inherit;font-weight:700;color:var(--accent);background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;cursor:pointer}
.more:hover{border-color:var(--accent)}
/* fiche */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:.95rem;margin-bottom:18px}
.eyebrow{color:var(--muted);font-size:.9rem;margin:0 0 6px;font-variant-numeric:tabular-nums}
.lede{font-size:1.1rem;margin:10px 0 12px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:18px}
.card h2{margin-bottom:10px}
.card.money{border-color:var(--ok);background:var(--ok-soft)}
.card.money h2{color:var(--ok)}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.sc-row:first-of-type{border-top:0}
.sc-lab{font-weight:700}
.sc-lab span{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.sc-bar{display:flex;gap:3px}
.sc-bar i{width:18px;height:10px;border-radius:3px;background:var(--line);display:block}
.sc-bar i.on{background:var(--accent)}
.sc-val{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.sc-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--ink)}
.sc-total b{font-family:var(--font-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.cx{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.cx-pill{font-family:var(--font-display);font-weight:700;padding:3px 12px;border-radius:999px;border:1.5px solid currentColor}
.cx-pill.Faible{color:var(--ok)} .cx-pill.Moyenne{color:var(--warn)} .cx-pill.Élevée{color:var(--bad)}
.cx p{margin:0;flex:1 1 280px}
ul.clean{margin:0;padding-left:1.1em}
ul.clean li{margin:4px 0}
.pmr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.pmr .blk{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:14px 16px}
.pmr .plus{border-top-color:var(--ok)}
.pmr .moins{border-top-color:var(--warn)}
.pmr .risq{border-top-color:var(--bad)}
.pmr h3{font-size:1rem;margin-bottom:8px}
.src li{margin:6px 0;word-break:break-word}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pn a{text-decoration:none;font-weight:700;max-width:48%}
.pn a span{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.pn .next{text-align:right;margin-left:auto}
@media (max-width:700px){
  .pmr{grid-template-columns:1fr}
}
@media (max-width:520px){
  h1{font-size:1.65rem}
  .meter{display:none}
  .row{gap:10px;padding:13px 12px}
  .sc-bar i{width:13px}
}
@media (prefers-reduced-motion:no-preference){
  .row,.fbtn{transition:background-color .15s ease}
}
</style>
</head>

const ST = {trou:{lab:"Aucun concurrent trouvé",chip:"Aucun concurrent trouvé"},angle:{lab:"Concurrence partielle",chip:"Concurrence partielle"},pris:{lab:"Déjà pris",chip:"Déjà pris"}};
const SEUIL = 12;
// Dernier ajout : seules les idées de ce lot portent neu:true (retirer neu des anciennes à chaque ajout).
const LOT = "21 novembre 2026 · idées fun pour les jeunes";
const CRIT = [["c","Concurrence","5 = aucun concurrent trouvé"],["m","Marché","taille du public en France"],["a","Argent","moyenne des deux notes ci-dessous"],["f","Facilité","5 = rapide à construire"]];
const STAR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l2 4.3 4.7.5-3.5 3.2 1 4.6L8 11.5 3.8 13.8l1-4.6L1.3 6l4.7-.5z"/></svg>';

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUB = [["r","Rentable vite","5 = on peut faire payer dès le début"],["g","Gains possibles","5 = peut rapporter gros"]];
D.forEach(d => { if (d.s.r != null && d.s.g != null) d.s.a = (d.s.r + d.s.g) / 2; });
const tot = d => d.s.c + d.s.m + d.s.a + d.s.f;
const fmt = n => String(n).replace(".", ",");

const RANKED = D.slice().sort((a,b) =>
  tot(b) - tot(a) ||
  (b.fav?1:0) - (a.fav?1:0) ||
  (a.cut?1:0) - (b.cut?1:0) ||
  b.s.c - a.s.c ||
  b.s.a - a.s.a ||
  a.nom.localeCompare(b.nom, "fr"));
RANKED.forEach((d,i) => d.rank = i + 1);
const BY = Object.fromEntries(D.map(d => [d.id, d]));

const app = document.getElementById("app");
let filter = "all";
let sortBy = "score";
let showLow = false;
let listScroll = 0;

function chips(d, withCat){
  let h = '<span class="chip ' + d.st + '">' + esc(ST[d.st].chip) + '</span>';
  if (d.neu) h += '<span class="chip new">Nouvelle</span>';
  if (d.fav) h += '<span class="chip fav">' + STAR + 'Favori</span>';
  if (d.cut) h += '<span class="chip cut">Écartée : ' + esc(typeof d.cut === "string" ? d.cut : "trop compliquée") + '</span>';
  if (withCat) h += '<span class="chip cat">' + esc(d.cat) + '</span>';
  return h;
}
function pips(n, cls){
  let h = '<span class="' + cls + '" aria-hidden="true">';
  for (let i = 1; i <= 5; i++) h += '<i' + (i <= n ? ' class="on"' : (i - 0.5 === n ? ' class="half"' : '')) + '></i>';
  return h + '</span>';
}
function pool(){ return showLow ? D : D.filter(d => tot(d) >= SEUIL); }
function counts(){
  const P = pool();
  return {
    all: P.length,
    fav: P.filter(d => d.fav).length,
    neu: D.filter(d => d.neu).length,
    trou: P.filter(d => d.st === "trou").length,
    angle: P.filter(d => d.st === "angle").length,
    pris: P.filter(d => d.st === "pris").length
  };
}
function visible(){
  let v = RANKED.filter(d =>
    (showLow || filter === "neu" || tot(d) >= SEUIL) &&
    (filter === "all" ? true :
     filter === "fav" ? !!d.fav :
     filter === "neu" ? !!d.neu :
     d.st === filter));
  if (sortBy === "c") v = v.slice().sort((a,b) => b.s.c - a.s.c || a.rank - b.rank);
  if (sortBy === "f") v = v.slice().sort((a,b) => b.s.f - a.s.f || a.rank - b.rank);
  if (sortBy === "a") v = v.slice().sort((a,b) => b.s.a - a.s.a || a.rank - b.rank);
  return v;
}

function renderList(){
  document.title = "Idées d'applis classées";
  const n = counts();
  const F = [["all","Toutes",n.all],["neu","Nouvelles",n.neu],["fav","Favoris",n.fav],["trou","Aucun concurrent",n.trou],["angle","Concurrence partielle",n.angle],["pris","Déjà prises",n.pris]];
  const vis = visible();
  const nHidden = D.filter(d => tot(d) < SEUIL).length;
  const rows = vis.map(d =>
    '<a class="row' + (d.st === "pris" ? " is-pris" : "") + (d.neu ? " is-new" : "") + '" href="#' + d.id + '">' +
      '<span class="rank">' + d.rank + '</span>' +
      '<span class="main"><span class="name">' + esc(d.nom) + '</span>' +
      '<span class="pitch">' + esc(d.pitch) + '</span>' +
      '<span class="tags">' + chips(d, false) + '</span></span>' +
      '<span class="score" aria-label="Note ' + fmt(tot(d)) + ' sur 20"><span class="total">' + fmt(tot(d)) + '<small>/20</small></span>' +
      '<span class="meter">' + CRIT.map(c => '<span>' + c[1].slice(0,4) + '.</span>' + pips(d.s[c[0]], "pips")).join("") + '</span></span>' +
    '</a>').join("");
  const NEW = RANKED.filter(d => d.neu);
  const news = NEW.length ?
    '<section class="news" aria-labelledby="newsT"><h2 id="newsT"><span class="dot" aria-hidden="true"></span>Nouveau · ' + LOT + '</h2>' +
    '<p>' + (NEW.length > 1 ? NEW.length + ' idées ajoutées. Elles sont surlignées dans la liste.' : '1 idée ajoutée. Elle est surlignée dans la liste.') + '</p>' +
    '<ul class="newlist">' + NEW.map(d => '<li><a href="#' + d.id + '">' + esc(d.nom) + '</a><span>' + fmt(tot(d)) + '/20</span></li>').join("") + '</ul>' +
    (filter !== "neu" ? '<button type="button" class="fbtn" data-f="neu">Ne voir que les nouvelles</button>' : '') +
    '</section>' : '';
  app.innerHTML =
    '<header><h1>Idées d\'applis classées</h1>' +
    '<p class="sub">Toutes les idées dont on a parlé, notées sur 20 et classées. Touche une idée pour ouvrir sa fiche : les plus, les moins, les risques et la complexité.</p></header>' +
    news +
    '<div class="filters" role="group" aria-label="Filtrer les idées">' +
      F.map(f => '<button type="button" class="fbtn" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + esc(f[1]) + ' <span class="n">' + f[2] + '</span></button>').join("") +
    '</div>' +
    '<div class="toolbar"><span>' + vis.length + ' idée' + (vis.length > 1 ? "s" : "") + ' affichée' + (vis.length > 1 ? "s" : "") + ' sur ' + D.length + '</span>' +
      '<label for="sort">Trier par <select id="sort">' +
        [["score","Note globale"],["c","Concurrence la plus faible"],["a","Argent"],["f","Facilité"]].map(o => '<option value="' + o[0] + '"' + (sortBy === o[0] ? " selected" : "") + '>' + o[1] + '</option>').join("") +
      '</select></label></div>' +
    '<nav class="list" aria-label="Idées classées">' + (rows || '<p class="empty">' + (showLow ? 'Aucune idée dans ce filtre.' : 'Aucune idée de ce filtre n\'a 12/20 ou plus.') + '</p>') + '</nav>' +
    '<button type="button" class="more" id="toggleLow" aria-expanded="' + showLow + '">' +
      (showLow ? 'Masquer les idées notées sous 12/20' : 'Afficher les ' + nHidden + ' idées notées sous 12/20') +
    '</button>' +
    '<section class="method"><h2>Comment lire les notes</h2>' +
      '<p>Chaque idée est notée de 1 à 5 sur quatre critères, pour un total sur 20 :</p>' +
      '<dl>' + CRIT.map(c => '<dt>' + c[1] + '</dt><dd>' + c[2] + '</dd>').join("") + '</dl>' +
      '<p>Trois niveaux de concurrence : « Aucun concurrent trouvé », le terrain semble libre ; « Concurrence partielle », des outils existent mais n\'en couvrent qu\'une partie, il reste une façon de se démarquer ; « Déjà pris », le besoin est bien couvert. Les idées notées sous 12/20 sont masquées par défaut, sauf dans le filtre « Nouvelles ».</p>' +
      '<p>L\'argent est la moyenne de deux notes : « Rentable vite » (peut-on faire payer dès le début ?) et « Gains possibles » (combien ça peut rapporter au mieux). D\'où des totaux en demi-points.</p>' +
      '<p>Chaque idée a une rubrique « Comment la rentabiliser ». Les prix indiqués sont des ordres de grandeur à tester, pas des chiffres de marché.</p>' +
      '<p>« Aucun concurrent trouvé » veut dire qu\'aucune appli dédiée n\'est apparue dans les recherches, pas qu\'il n\'en existe aucune. Notes estimées par Claude à partir de recherches web des 20 et 21 novembre 2026 : à revérifier dans les stores avant de te lancer.</p>' +
    '</section>';
  app.querySelectorAll(".fbtn").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; renderList(); }));
  document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; renderList(); });
  document.getElementById("toggleLow").addEventListener("click", () => { showLow = !showLow; renderList(); });
}

function list(arr){ return '<ul class="clean">' + arr.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>'; }

function renderDetail(d){
  document.title = d.nom + " · Idées d'applis";
  const i = d.rank - 1;
  const prev = RANKED[i - 1], next = RANKED[i + 1];
  const row = (c, sub) => '<div class="sc-row' + (sub ? ' sub' : '') + '"><span class="sc-lab">' + c[1] + '<span>' + c[2] + '</span></span>' +
    pips(d.s[c[0]], "sc-bar") + '<span class="sc-val">' + fmt(d.s[c[0]]) + '/5</span></div>';
  const sc = CRIT.map(c => row(c, false) + (c[0] === "a" && d.s.r != null ? SUB.map(x => row(x, true)).join("") : "")).join("");
  const appBlock = d.app
    ? '<section class="card"><h2>L\'appli</h2>' + list(d.app) + '</section>'
    : '<section class="card"><h2>Ce qu\'on pourrait encore faire</h2><p style="margin:0">' + esc(d.angle) + '</p></section>';
  app.innerHTML =
    '<a class="back" href="#idees">← Toutes les idées</a>' +
    '<p class="eyebrow">N° ' + d.rank + ' sur ' + D.length + ' · ' + esc(ST[d.st].lab) + ' · ' + esc(d.cat) + '</p>' +
    '<h1>' + esc(d.nom) + '</h1>' +
    '<p class="lede">' + esc(d.pitch) + '</p>' +
    '<div class="tags">' + chips(d, false) + '</div>' +
    '<section class="card" aria-label="Notes"><h2>Notes</h2>' + sc +
      '<div class="sc-total"><span>Total</span><b>' + fmt(tot(d)) + '/20</b></div></section>' +
    '<section class="card"><h2>Complexité</h2><div class="cx"><span class="cx-pill ' + d.cx[0] + '">' + d.cx[0] + '</span><p>' + esc(d.cx[1]) + '</p></div></section>' +
    appBlock +
    (d.money ? '<section class="card money"><h2>Comment la rentabiliser</h2>' + list(d.money) + '</section>' : '') +
    '<div class="pmr">' +
      '<section class="blk plus"><h3>Les plus</h3>' + list(d.plus) + '</section>' +
      '<section class="blk moins"><h3>Les moins</h3>' + list(d.moins) + '</section>' +
      '<section class="blk risq"><h3>Les risques</h3>' + list(d.risq) + '</section>' +
    '</div>' +
    '<section class="card"><h2>Concurrence repérée</h2>' + list(d.conc) + '</section>' +
    '<section class="card"><h2>Sources</h2><ul class="clean src">' +
      d.src.map(s => '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>').join("") +
    '</ul></section>' +
    '<nav class="pn" aria-label="Idée précédente ou suivante">' +
      (prev ? '<a href="#' + prev.id + '"><span>← N° ' + prev.rank + '</span>' + esc(prev.nom) + '</a>' : '') +
      (next ? '<a class="next" href="#' + next.id + '"><span>N° ' + next.rank + ' →</span>' + esc(next.nom) + '</a>' : '') +
    '</nav>';
}

let current = null;
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const d = BY[h];
  if (d){
    if (!current) listScroll = window.scrollY;
    current = d.id;
    renderDetail(d);
    window.scrollTo(0, 0);
  } else {
    const wasDetail = current !== null;
    current = null;
    renderList();
    window.scrollTo(0, wasDetail ? listScroll : 0);
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
